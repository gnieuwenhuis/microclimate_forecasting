# Deployment: lethbridge  (seeded — trainable from day one)
#
# Downscales HRDPS to a free, deep-history official station near Henderson Lake.
# This is the pipeline-proving deployment: ECCC + ACIS sources, CaSPAr historical seed,
# champion/challenger publish gate. See ADR-0001, ADR-0006, ADR-0008.
#
# Values marked `# CONFIRM` need a one-time lookup in the ACIS data viewer
# (https://acis.alberta.ca/weather-data-viewer.jsp) — the exact ACIS station identifiers
# and neighbor coordinates are the deferred config-authoring values from the scaffolding
# spec. Coordinates given are best-known.

deployment_id: lethbridge
# Seeded deployment: every observation source has deep history; training uses the CaSPAr
# seed + the logger. (v1 has only this strategy; cold-start is deferred — ADR-0008.)

target:
  # Closest free, deep-history official station to Henderson Lake (~6 km E, at 49.687,
  # -112.826). An ACIS ag-station is a better skill demo than YQL (HRDPS does not already
  # nail it). ACIS station #9835; identifier confirmed from the ACIS station dropdown.
  station_id: "9835"                       # ACIS: Lethbridge Demo Farm IMCIN
  connector_key: acis
  lat: 49.68872
  lon: -112.74494
  elevation_m: 903

neighbors:
  # Free sources only. YQL is the regional baseline; ACIS county stations are the
  # storm-advection vectors called out in the PoP literature (north/NE/SW of the city).
  - station_id: "3033875"                  # ECCC Lethbridge Airport (TC: YQL, MSC stnID 2263)
    connector_key: envcanada
    lat: 49.6303
    lon: -112.7989
    elevation_m: 929
  - station_id: "710547"                   # ACIS: Picture Butte LITE (N).
    # Reachability CONFIRMED (spike #3): ungated ACIS AIMM daily file works for this LITE station
    # (short-name `PictureButte`), years 2022-2026, fresh, DAILY-only (no hourly twin on ECCC).
    connector_key: acis
    lat: 49.8867                           # CONFIRM exact station coords + elevation (still unverified)
    lon: -112.78
    elevation_m: null                      # CONFIRM
  - station_id: "9883"                     # ACIS: Iron Springs IMCIN (NE)
    # STALE (spike #3): ungated ACIS AIMM file ends 2023-05-18 (2026 file is header-only); ECCC AGDM
    # twin 42728 also ends 2023. HISTORY-ONLY (2005-2023) — NOT usable for live.
    connector_key: acis
    lat: 49.93                             # CONFIRM 2nd-decimal coords + elevation (gated ACIS API)
    lon: -112.687
    elevation_m: null                      # CONFIRM
  - station_id: "9747"                     # ACIS: Blood Tribe Ag Project IMCIN (SW — foothills convection)
    connector_key: acis
    lat: 49.5333
    lon: -113.05
    elevation_m: null                      # CONFIRM elevation (gated ACIS API)

# NB: ungated ACIS is DAILY-only (AIMM climate file); ungated *live hourly* is unavailable for
# these stations (ECCC AGDM hourly twins are dead, 2023/2024). Architecture pivot is deferred —
# see docs/spikes/0003-acis-ungated-access.md (spike #3). The acis connector slice (#1) is blocked.
enabled_sources: [hrdps_geomet, hrdps_caspar, envcanada, acis]

nwp:
  product: hrdps
  live_connector: hrdps_geomet             # GeoMet/Datamart — inference
  historical_connector: hrdps_caspar       # CaSPAr archive — training seed
  sampling: nearest_grid_cell              # sample HRDPS at the target lat/lon
  # The CaSPAr and GeoMet variable/grid spec MUST match (ADR-0007 / CONTEXT "one HRDPS spec").

horizon_hours: 48
lag_hours: 6                               # recent-observation window for obs features

feature_groups:
  nwp: true
  observations: true                       # target + neighbor obs as inputs (ADR-0002)

label:
  precip_occurrence_threshold_mm: 0.2      # hour counts as "precip" at/above this (tipping-bucket trace)

training:
  seed:
    source: caspar
    start: "2017-05-22"                    # CaSPAr HRDPS archive start
  holdout_months: 12                       # temporal holdout = most recent 12 months

output:
  forecast_json: "forecasts/lethbridge.json"   # published to gh-pages
