# Deployment: lethbridge  (seeded — trainable from day one)
#
# Downscales HRDPS to a free, deep-history official station near Henderson Lake.
# This is the pipeline-proving deployment: ECCC observations, CaSPAr historical seed,
# champion/challenger publish gate. See ADR-0001, ADR-0006, ADR-0008, ADR-0010.
#
# Target + neighbors are live ECCC stations on the ungated bulk hourly CSV. ACIS was
# dropped: its only ungated feed is daily, and no ungated *live hourly* feed exists for
# the ag stations (spike #3 / docs/spikes/0003; pivot recorded in ADR-0010).

deployment_id: lethbridge
# Seeded deployment: every observation source has deep history; training uses the CaSPAr
# seed + the logger. (v1 has only this strategy; cold-start is deferred — ADR-0008.)

target:
  # ECCC Lethbridge CDA: a non-airport ag research station ~5 km E of Lethbridge and ~4 km
  # from Henderson Lake (49.687, -112.826). Live on the ungated ECCC bulk hourly CSV to
  # 2026-05-29, deep hourly history 1994–present; carries temp/dewpoint/RH/precip/pressure.
  # Valley-bench (non-airport) siting => more local bias for HRDPS to learn than YQL.
  # Chosen over ACIS Demo Farm #9835 once spike #3 proved ACIS has no ungated live-hourly
  # feed (ADR-0010). Fallback target if CDA fails the publish gate: YQL, stnID 49268.
  station_id: "2265"                         # ECCC Lethbridge CDA (MSC StationID; Climate ID 3033890)
  connector_key: envcanada
  lat: 49.70
  lon: -112.77
  elevation_m: 910

neighbors:
  # Live ECCC hourly stations only (advection vectors toward the target). The close 8–60 km
  # advection ring is dead on the ungated feed (ag-network stations stopped reporting hourly
  # by 2023/24 — spike #3), so the nearest live neighbors are 60–100 km out. A 60–100 km
  # lever arm is ~1.5–3 h of advection lead at storm speeds — coarse but useful across 1–48 h.
  # Per-variable missingness masks cover the noted sensor gaps. (ADR-0002, ADR-0010.)
  - station_id: "49368"                      # ECCC Pincher Creek (W, ~86 km) — chinook gateway; full coverage
    connector_key: envcanada
    lat: 49.52
    lon: -114.00
    elevation_m: 1190
  - station_id: "2224"                       # ECCC Claresholm (NW, ~66 km) — NB: no station pressure
    connector_key: envcanada
    lat: 50.00
    lon: -113.64
    elevation_m: 1009
  - station_id: "26971"                      # ECCC Cardston (SW, ~64 km) — NB: precip sensor dropped 2026 (temp/RH/wind)
    connector_key: envcanada
    lat: 49.20
    lon: -113.29
    elevation_m: 1136
  - station_id: "8804"                       # ECCC Milk River (SE, ~85 km) — full coverage
    connector_key: envcanada
    lat: 49.13
    lon: -112.05
    elevation_m: 1050

enabled_sources: [hrdps_geomet, hrdps_caspar, envcanada]

nwp:
  product: hrdps
  live_connector: hrdps_geomet             # GeoMet/Datamart — inference
  historical_connector: hrdps_caspar       # CaSPAr archive — training seed
  sampling: nearest_grid_cell              # sample HRDPS at the target lat/lon
  # The CaSPAr and GeoMet variable/grid spec MUST match (ADR-0007 / CONTEXT "one HRDPS spec").

horizon_hours: 48
lag_hours: 6                               # recent-observation window for obs features

feature_groups:
  nwp: true
  observations: true                       # target + neighbor obs as inputs (ADR-0002)

label:
  precip_occurrence_threshold_mm: 0.2      # hour counts as "precip" at/above this (tipping-bucket trace)

training:
  seed:
    source: caspar
    start: "2017-05-22"                    # CaSPAr HRDPS archive start
  holdout_months: 12                       # temporal holdout = most recent 12 months

output:
  forecast_json: "forecasts/lethbridge.json"   # published to gh-pages
