name: training
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.list.outputs.deployments }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          ids=$(ls config/deployments/*.yml | xargs -n1 basename | sed 's/\.yml$//' | jq -R . | jq -cs .)
          echo "deployments=$ids" >> "$GITHUB_OUTPUT"

  run:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push training-data + gh-pages, create Releases
    # One shared group across the whole matrix: the training-data and gh-pages branches are
    # shared by all deployments, so matrix jobs must serialize (a per-deployment group would let
    # them race — force-pushing the store from a stale clone / non-fast-forward gh-pages pushes).
    concurrency:
      group: training-shared-state
      cancel-in-progress: false
    strategy:
      matrix:
        deployment: ${{ fromJson(needs.discover.outputs.deployments) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Check out (or bootstrap) the public training-data store
        env:
          STORE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git clone --depth 1 --branch training-data "$STORE_URL" store 2>/dev/null; then
            echo "Cloned existing training-data branch."
          else
            echo "Bootstrapping empty training-data store."
            mkdir store
          fi

      - name: Train + gate + stage champions
        env:
          TRAINING_STORE_ROOT: store
          CHAMPION_OUTPUT_DIR: champions
          REGISTRY_PATH: registry.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python -m microclimate.pipelines.training --deployment ${{ matrix.deployment }}

      - name: Force-push the store state back to training-data
        env:
          STORE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          cd store
          git init -q 2>/dev/null || true
          git checkout -q -B training-data
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m "store: $(date -u +%FT%TZ)" || { echo "no changes"; exit 0; }
          git push -f "$STORE_URL" training-data

      - name: Publish promoted champions (Release assets) + registry.json (gh-pages)
        if: hashFiles('champions/*.joblib') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in champions/*.joblib; do
            base=$(basename "$f" .joblib)
            gh release create "champion-$base" "$f" --title "champion-$base" --notes "Promoted champion $base" 2>/dev/null \
              || gh release upload "champion-$base" "$f" --clobber
          done
          # Base the worktree on the real remote gh-pages (preserving its content + history) so
          # the push fast-forwards; bootstrap an orphan branch only when gh-pages doesn't exist.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth 1
            git worktree add -f --detach gp origin/gh-pages
          else
            git worktree add -f --detach gp
            cd gp && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true && cd ..
          fi
          cp registry.json gp/registry.json
          cd gp && git add registry.json \
            && git -c user.name=ci -c user.email=ci@local commit -q -m "registry: $(date -u +%FT%TZ)" \
            && git push origin HEAD:gh-pages || echo "registry unchanged"
