[project]
name = "microclimate"
version = "0.0.0"
description = "Free microclimate temperature + PoP forecasting by downscaling HRDPS."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pandera[pandas]>=0.20",
  "pandas>=2.2",
  "lightgbm>=4.3",
  "pyyaml>=6.0",
]

[project.scripts]
microclimate-inference = "microclimate.pipelines.inference:main"
microclimate-training = "microclimate.pipelines.training:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microclimate"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "import-linter>=2.0",
  "pytest>=8.0",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
